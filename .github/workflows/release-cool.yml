name: Release cool

on:
  push:
    branches:
      - master
    paths:
      - "cool/**"
      - ".github/workflows/release-cool.yml"
  workflow_dispatch:

concurrency:
  group: release-cool
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test
        run: cargo test --locked --manifest-path cool/Cargo.toml
      - name: Build
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --manifest-path cool/Cargo.toml
      - name: Package
        run: |
          cp cool/target/x86_64-unknown-linux-musl/release/cool cool-linux-x86_64
          sha256sum cool-linux-x86_64 > cool-linux-x86_64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: cool-linux-x86_64
          path: |
            cool-linux-x86_64
            cool-linux-x86_64.sha256
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --force cool-latest "$GITHUB_SHA"
          git push --force origin refs/tags/cool-latest
          if gh release view cool-latest >/dev/null 2>&1; then
            gh release upload cool-latest cool-linux-x86_64 cool-linux-x86_64.sha256 --clobber
            gh release edit cool-latest --title "Latest cool installer" --notes "Built from $GITHUB_SHA."
          else
            gh release create cool-latest cool-linux-x86_64 cool-linux-x86_64.sha256 --verify-tag --title "Latest cool installer" --notes "Built from $GITHUB_SHA."
          fi
