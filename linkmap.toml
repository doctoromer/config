[system]
binaries = "/"
nvim = "/etc/xdg/nvim"
"misc/gitconfig" = "/etc/gitconfig"
"misc/tmux.conf" = "/etc/tmux.conf"

[local]
"binaries/usr/bin" = "~/.local/bin"
"binaries/usr/local/share/zsh/site-functions" = "~/.local/zsh/site-functions"
"binaries/usr/share/man/man1" = "~/.local/man/man1"
"nvim" = "~/.config/nvim"
"misc/gitconfig" = "~/.config/gitconfig"
"misc/tmux.conf" = "~/.tmux.conf"
"misc/usr/share/tmux/dracula" = "~/.local/tmux/dracula"
"zsh/usr/share/zsh/config" = "~/.local/zsh/config"
