set -g status-right '#[fg=black]#(cut -d " " -f 1-3 /proc/loadavg)#[default] | #[fg=lightblue]%H:%M#[default]'

# vim tmux integration
is_vim="ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^XZT ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n M-h if-shell "$is_vim" "send-keys M-h"  "select-pane -L"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j"  "select-pane -D"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k"  "select-pane -U"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l"  "select-pane -R"
bind-key -n M-\\ if-shell "$is_vim" "send-keys M-\\" "select-pane -l"

# Move while in copy mode
bind-key -T copy-mode-vi M-h select-pane -L
bind-key -T copy-mode-vi M-j select-pane -D
bind-key -T copy-mode-vi M-k select-pane -U
bind-key -T copy-mode-vi M-l select-pane -R
bind-key -T copy-mode-vi M-\\ select-pane -l

# Select windows
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

bind-key -n M-f resize-pane -Z

# windows navigating
bind-key -n C-M-l next-window
bind-key -n C-M-h previous-window

# set vim-like keys
setw -g mode-keys vi
set-window-option -g xterm-keys on
set-window-option -g mode-keys vi
set-option -g status-keys vi

# set numbering
set -g base-index 1
setw -g pane-base-index 1

# set naming
setw -g automatic-rename on
set -g renumber-windows on
set -g set-titles on

# disable escape sleep
set -sg escape-time 0

# Extended keys
set -g extended-keys on
set -g extended-keys-format csi-u

# enable 256 colors support
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'

# Create windows and panes from current directory
bind-key -n C-M-c new-window -c "#{pane_current_path}"
bind-key -n M-v split-window -h -c "#{pane_current_path}"
bind-key -n M-s split-window -v -c "#{pane_current_path}"

# Copy mode keybindings
bind-key -n M-x copy-mode
bind-key -n M-p paste-buffer -p
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'w' send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

set -g focus-events on

set -g history-limit 100000

set -g @dracula-plugins "git cpu-usage ram-usage time"
set -g @dracula-border-contrast true
set -g @dracula-show-timezone false
set -g @dracula-day-month true
set -g @dracula-military-time true

global_dracula_file="/usr/share/tmux/dracula/dracula.tmux"
if-shell "[ -f $global_dracula_file ]" {
    run "$global_dracula_file"
}

local_dracula_file="~/.local/tmux/dracula/dracula.tmux"
if-shell "[ -f $local_dracula_file ]" {
    run "$local_dracula_file"
}

